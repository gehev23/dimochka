<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Для тебя, мой Димочка 💖</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('https://www.film.ru/sites/default/files/images/83-47466.jpg') no-repeat center center fixed;
    background-size: cover;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .card {
    background: rgba(255,255,255,0.9);
    padding: 40px 50px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    animation: pop 0.8s ease;
  }
  h1 { color: #e63946; margin: 0 0 15px; }
  p { color: #555; font-size: 18px; margin: 0; }
  .heart {
    position: absolute;
    color: #ff4d6d;
    animation: float 6s linear infinite;
    font-size: 24px;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Ты—моё всё, радость моя 💕</h1>
    <p>Спасибо, что ты рядом. Я тебя очень люблю!! Ты приносишь мне невероятную радость каждый день, многое для меня значишь</p>
  </div>

<script>
  // Летающие сердечки
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['❤','💖','💕','💗','💘'][Math.floor(Math.random()*5)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (4 + Math.random()*4) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 8000);
  }, 300);
</script>
</body>
</html>
